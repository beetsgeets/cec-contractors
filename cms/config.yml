backend:
  name: git-gateway
  branch: main

media_folder: "images/uploads"
public_folder: "/images/uploads"

collections:
  # File-based site text: each file holds a list of rows (page | section | content_key).
  - name: "page_content"
    label: "Pages"
    files:
      - label: "Home"
        name: "home"
        file: "content/pages/home.md"
        fields:
          - label: "Content rows"
            name: "rows"
            widget: "list"
            summary: "{{fields.page}} | {{fields.section}} | {{fields.content_key}}"
            fields:
              - { label: "Page", name: "page", widget: "string", hint: "e.g. home, about, global" }
              - { label: "Section", name: "section", widget: "string" }
              - { label: "Content key", name: "content_key", widget: "string" }
              - {
                  label: "Content value",
                  name: "content_value",
                  widget: "text",
                  hint: "HTML allowed where the template uses rich text.",
                }

      - label: "About"
        name: "about"
        file: "content/pages/about.md"
        fields:
          - label: "Content rows"
            name: "rows"
            widget: "list"
            summary: "{{fields.page}} | {{fields.section}} | {{fields.content_key}}"
            fields:
              - { label: "Page", name: "page", widget: "string" }
              - { label: "Section", name: "section", widget: "string" }
              - { label: "Content key", name: "content_key", widget: "string" }
              - { label: "Content value", name: "content_value", widget: "text" }

      - label: "Services page"
        name: "services_page"
        file: "content/pages/services.md"
        fields:
          - label: "Content rows"
            name: "rows"
            widget: "list"
            summary: "{{fields.page}} | {{fields.section}} | {{fields.content_key}}"
            fields:
              - { label: "Page", name: "page", widget: "string" }
              - { label: "Section", name: "section", widget: "string" }
              - { label: "Content key", name: "content_key", widget: "string" }
              - { label: "Content value", name: "content_value", widget: "text" }

      - label: "Portfolio page"
        name: "portfolio_page"
        file: "content/pages/portfolio.md"
        fields:
          - label: "Content rows"
            name: "rows"
            widget: "list"
            summary: "{{fields.page}} | {{fields.section}} | {{fields.content_key}}"
            fields:
              - { label: "Page", name: "page", widget: "string" }
              - { label: "Section", name: "section", widget: "string" }
              - { label: "Content key", name: "content_key", widget: "string" }
              - { label: "Content value", name: "content_value", widget: "text" }

      - label: "Contact"
        name: "contact"
        file: "content/pages/contact.md"
        fields:
          - label: "Content rows"
            name: "rows"
            widget: "list"
            summary: "{{fields.page}} | {{fields.section}} | {{fields.content_key}}"
            fields:
              - { label: "Page", name: "page", widget: "string" }
              - { label: "Section", name: "section", widget: "string" }
              - { label: "Content key", name: "content_key", widget: "string" }
              - { label: "Content value", name: "content_value", widget: "text" }

  - name: "services"
    label: "Services"
    folder: "content/services"
    create: true
    slug: "{{slug}}"
    identifier_field: "title"
    extension: "md"
    format: "frontmatter"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Description", name: "description", widget: "text" }
      - {
          label: "Icon class",
          name: "icon_class",
          widget: "string",
          default: "fas fa-wrench",
          hint: "Font Awesome classes, e.g. fas fa-hammer",
        }
      - { label: "Order", name: "order_index", widget: "number", default: 0, value_type: "int", min: 0 }

  - name: "portfolio"
    label: "Portfolio"
    folder: "content/portfolio"
    create: true
    slug: "{{slug}}"
    identifier_field: "title"
    extension: "md"
    format: "frontmatter"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Description", name: "description", widget: "text" }
      - { label: "Image", name: "image", widget: "image" }
      - { label: "Category", name: "category", widget: "string", required: false }
      - { label: "Order", name: "order_index", widget: "number", default: 0, value_type: "int", min: 0 }

<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="cec:github-repo"
      content="YOUR_GITHUB_USERNAME/cec-contractors"
    />
    <meta name="cec:github-branch" content="main" />
    <title>CEC Contractors Admin</title>
    <link rel="stylesheet" href="css/dashboard.css" />
  </head>
  <body class="dash-app">
    <header class="dash-topbar">
      <span class="dash-brand">CEC Contractors Admin</span>
      <div class="dash-userarea">
        <span class="dash-email" id="dashUserEmail"></span>
        <button type="button" class="dash-btn dash-btn-primary" id="logoutBtn">
          Logout
        </button>
      </div>
    </header>

    <div id="dashError" class="dash-error" hidden></div>

    <main class="dash-main">
      <div id="viewDashboard">
        <h2 class="dash-section-title">Choose a page to edit</h2>

        <div class="dash-grid">
          <button type="button" id="tileHome" class="dash-tile">
            <h3>Edit Home Page</h3>
            <p>Hero, highlights, footer copy</p>
          </button>
          <button type="button" id="tileServices" class="dash-tile">
            <h3>Edit Services</h3>
            <p>Intro and bullets</p>
          </button>
          <button type="button" id="tileAbout" class="dash-tile">
            <h3>Edit About</h3>
            <p>Story, team, credentials</p>
          </button>
          <button type="button" id="tileContact" class="dash-tile">
            <h3>Edit Contact Info</h3>
            <p>Intro and hours</p>
          </button>
        </div>

        <div class="dash-subgrid">
          <p class="dash-subgrid-title">Portfolio</p>
          <p class="dash-muted" style="margin: 0 0 0.75rem; font-size: 0.92rem;">
            Each <code>.md</code> file in <code>content/portfolio/</code> opens its own editor.
          </p>
          <div id="portfolioTiles" class="dash-grid"></div>
        </div>
      </div>

      <div id="viewEditor" hidden>
        <div class="dash-editor">
          <div class="dash-editor-header">
            <button type="button" class="dash-btn dash-btn-ghost" id="backBtn">
              ← Back to Dashboard
            </button>
            <h2 id="editorTitle">Edit</h2>
          </div>
          <div id="editorFields"></div>
          <div class="dash-footer-actions">
            <button type="button" class="dash-btn dash-btn-primary" id="saveBtn">
              Save changes
            </button>
          </div>
        </div>
      </div>
    </main>

    <div id="dashToast" class="dash-toast" hidden></div>

    <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
    <script src="js/js-yaml.min.js"></script>
    <script src="js/dashboard.js"></script>
  </body>
</html>

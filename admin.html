<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin login | CEC Contractors</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body class="admin-body" data-page="admin">
  <div class="admin-panel">
    <div class="admin-card">
      <h1>CEC Contractors</h1>
      <p class="sub">Staff sign in (Supabase Auth). Use the email and password created in your Supabase project.</p>
      <div id="loginMsg" class="admin-msg" hidden></div>
      <form id="loginForm">
        <div class="form-group">
          <label for="loginEmail">Email</label>
          <input id="loginEmail" type="email" autocomplete="username" required />
        </div>
        <div class="form-group">
          <label for="loginPassword">Password</label>
          <input id="loginPassword" type="password" autocomplete="current-password" required />
        </div>
        <button type="submit" class="btn btn-primary" style="width:100%;">Sign in</button>
      </form>
      <p style="margin-top:1.25rem;font-size:0.9rem;color:var(--color-muted);">
        <a href="index.html">← Back to website</a>
      </p>
    </div>
  </div>

  <script src="js/config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase-client.js"></script>
  <script src="js/admin.js" defer></script>
</body>
</html>
